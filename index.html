<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ensola – Záznam pohovoru</title>
  <style>
    :root {
      --green-dark:  #1B5016;
      --green-mid:   #2d7a25;
      --green-light: #3fa832; 
      --lime:        #8bc34a;
      --bg:          #0e1a0d;
      --surface:     #152413;
      --surface2:    #1e3319;
      --border:      #2a4a22;
      --text:        #e8f5e1;
      --muted:       #7da870;
      --ai-bubble:   #1e3319;
      --user-bubble: #1B5016;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--green-dark);
      border-bottom: 2px solid var(--green-light);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo-box {
      width: 44px; height: 44px;
      background: var(--green-light);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #fff;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .3px; }
    .header-text p  { font-size: .8rem; color: var(--lime); opacity: .85; }

    /* ── Meta card ── */
    #meta-section {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: none;
    }
    #meta-section.visible { display: block; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .8px; color: var(--lime); }
    .meta-value { font-size: .95rem; font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: .8rem;
      font-weight: 700;
    }
    .badge-high   { background: #2e7d32; color: #b9f6ca; }
    .badge-medium { background: #f57f17; color: #fff8e1; }
    .badge-low    { background: #b71c1c; color: #ffcdd2; }

    /* ── Screening results bar ── */
    #results-bar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: none;
      flex-wrap: wrap;
      gap: 20px;
    }
    #results-bar.visible { display: flex; }
    .result-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: .85rem;
    }
    .result-chip .icon { font-size: 1.1rem; }
    .result-chip .label { color: var(--muted); }
    .result-chip .val   { font-weight: 700; }
    .rating-score {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--lime);
      line-height: 1;
    }

    /* ── Conversation ── */
    #conversation {
      flex: 1;
      padding: 28px 32px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .turn {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .turn.assistant { flex-direction: row; }
    .turn.user      { flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 700;
      flex-shrink: 0;
    }
    .avatar-ai   { background: var(--green-dark); color: var(--lime); border: 2px solid var(--green-light); }
    .avatar-user { background: #2a4060; color: #90caf9; border: 2px solid #42a5f5; }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: .93rem;
      line-height: 1.6;
    }
    .bubble-ai {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }
    .bubble-user {
      background: var(--user-bubble);
      border-top-right-radius: 4px;
    }

    .speaker-name {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 4px;
    }
    .ai-name   { color: var(--lime); }
    .user-name { color: #90caf9; }

    /* ── States ── */
    #state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 32px;
      text-align: center;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-icon { font-size: 3rem; }
    #state h2   { font-size: 1.3rem; }
    #state p    { color: var(--muted); max-width: 380px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo-box">E</div>
  <div class="header-text">
    <h1>Ensola – Screening kandidáta</h1>
    <p>Záznam telefonického pohovoru</p>
  </div>
</header>

<!-- Meta info -->
<div id="meta-section">
  <div class="meta-grid" id="meta-grid"></div>
</div>

<!-- Screening results -->
<div id="results-bar" id="results-bar"></div>

<!-- Main content -->
<div id="state">
  <div class="spinner"></div>
  <h2>Načítavam záznam…</h2>
  <p>Prosím, čakajte.</p>
</div>

<div id="conversation" style="display:none"></div>

<script>
  const VAPI_KEY = '042cd1b9-990b-489d-b990-5cf5563100b4';

  const state   = document.getElementById('state');
  const convo   = document.getElementById('conversation');
  const metaSec = document.getElementById('meta-section');
  const metaGrid= document.getElementById('meta-grid');
  const resultsBar = document.getElementById('results-bar');

  function showState(icon, title, msg) {
    state.innerHTML = `
      <div class="state-icon">${icon}</div>
      <h2>${title}</h2>
      <p>${msg}</p>`;
    state.style.display = 'flex';
    convo.style.display  = 'none';
  }

  function fmt(ts) {
    if (!ts) return '–';
    const d = new Date(ts);
    return d.toLocaleString('sk-SK', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  }

  function dur(secs) {
    if (!secs) return '–';
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${String(s).padStart(2,'0')} min`;
  }

  function addMeta(label, value) {
    const div = document.createElement('div');
    div.className = 'meta-item';
    div.innerHTML = `<span class="meta-label">${label}</span><span class="meta-value">${value}</span>`;
    metaGrid.appendChild(div);
  }

  function ratingBadge(score) {
    const n = parseInt(score, 10);
    if (isNaN(n)) return `<span class="badge">${score}</span>`;
    const cls = n >= 8 ? 'badge-high' : n >= 5 ? 'badge-medium' : 'badge-low';
    return `<span class="badge ${cls}">${n}/10</span>`;
  }

  function addChip(icon, label, val) {
    const div = document.createElement('div');
    div.className = 'result-chip';
    div.innerHTML = `<span class="icon">${icon}</span><span class="label">${label}:</span><span class="val">${val}</span>`;
    resultsBar.appendChild(div);
  }

  function boolIcon(v) {
    if (v === true  || v === 'true'  || v === 'áno' || v === 'yes') return '✅ Áno';
    if (v === false || v === 'false' || v === 'nie' || v === 'no')  return '❌ Nie';
    return v || '–';
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const callId = params.get('id');

    if (!callId) {
      showState('🔍', 'Žiadne ID hovoru', 'URL musí obsahovať parameter ?id=<call_id>');
      return;
    }

    try {
      const res = await fetch(`https://api.vapi.ai/call/${callId}`, {
        headers: { Authorization: `Bearer ${VAPI_KEY}` }
      });

      if (!res.ok) {
        const err = await res.text();
        showState('⚠️', 'Chyba načítania', `Server vrátil: ${res.status} – ${err}`);
        return;
      }

      const data = await res.json();

      /* ── Meta info ── */
      addMeta('ID hovoru', `<span style="font-size:.78rem;opacity:.7">${callId}</span>`);
      addMeta('Začiatok',  fmt(data.startedAt));
      addMeta('Koniec',    fmt(data.endedAt));
      addMeta('Trvanie',   dur(data.call?.durationSeconds ?? data.durationSeconds));
      addMeta('Stav',      data.status ?? '–');
      if (data.customer?.number) addMeta('Telefón', data.customer.number);
      metaSec.classList.add('visible');

      /* ── Analysis / screening results ── */
      const analysis = data.analysis ?? {};
      const struct   = analysis.structuredData ?? {};

      const hodnotenie  = struct.hodnotenie  ?? struct.rating ?? analysis.rating;
      const vysvetlenie = struct.vysvetlenie ?? struct.explanation ?? analysis.summary ?? '';
      const skusenosti  = struct.skusenosti  ?? struct.skúsenosti;
      const suhlasProv  = struct.suhlasProvize ?? struct.suhlas_provize;
      const suhlasCest  = struct.suhlasCestovanie ?? struct.suhlas_cestovanie;
      const lokalita    = struct.lokalita;
      const nastup      = struct.nastup ?? struct.nástup;

      if (hodnotenie !== undefined) {
        addChip('⭐', 'Hodnotenie', ratingBadge(hodnotenie));
        addChip('💼', 'Skúsenosti', boolIcon(skusenosti));
        addChip('💰', 'Súhlas – provízia', boolIcon(suhlasProv));
        addChip('🚗', 'Súhlas – cestovanie', boolIcon(suhlasCest));
        if (lokalita) addChip('📍', 'Lokalita', lokalita);
        if (nastup)   addChip('📅', 'Nástup', nastup);
        resultsBar.classList.add('visible');
      }

      if (vysvetlenie) {
        const div = document.createElement('div');
        div.className = 'result-chip';
        div.style.cssText = 'width:100%;flex-direction:column;align-items:flex-start;gap:4px;';
        div.innerHTML = `<span class="label" style="font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;">Zhrnutie</span>
                         <span style="font-size:.9rem;line-height:1.5;">${vysvetlenie}</span>`;
        resultsBar.appendChild(div);
      }

      /* ── Transcript ── */
      const messages = data.messages ?? data.transcript ?? [];

      if (!messages.length) {
        showState('📭', 'Žiadny prepis', 'Hovor neobsahuje textový záznam konverzácie.');
        return;
      }

      state.style.display = 'none';
      convo.style.display  = 'flex';

      messages.forEach(msg => {
        const role = (msg.role ?? '').toLowerCase();
        if (!['assistant','user','bot','human'].includes(role)) return;

        const isAI = role === 'assistant' || role === 'bot';
        const text = msg.content ?? msg.message ?? msg.text ?? '';
        if (!text.trim()) return;

        const turn = document.createElement('div');
        turn.className = `turn ${isAI ? 'assistant' : 'user'}`;

        const avatarClass  = isAI ? 'avatar-ai'   : 'avatar-user';
        const avatarLabel  = isAI ? 'M'            : 'K';
        const bubbleClass  = isAI ? 'bubble-ai'   : 'bubble-user';
        const nameClass    = isAI ? 'ai-name'      : 'user-name';
        const speakerLabel = isAI ? 'Marek (AI)'   : 'Kandidát';

        turn.innerHTML = `
          <div class="avatar ${avatarClass}">${avatarLabel}</div>
          <div class="bubble ${bubbleClass}">
            <div class="speaker-name ${nameClass}">${speakerLabel}</div>
            ${escHtml(text)}
          </div>`;

        convo.appendChild(turn);
      });

    } catch (e) {
      showState('❌', 'Neočakávaná chyba', e.message);
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
  }

  load();
</script>
</body>
</html>
