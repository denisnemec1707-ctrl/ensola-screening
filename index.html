<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ensola - Zaznam pohovoru</title>
  <style>
    :root {
      --green-dark: #1B5016; --green-light: #3fa832; --lime: #8bc34a;
      --bg: #0e1a0d; --surface: #152413; --surface2: #1e3319;
      --border: #2a4a22; --text: #e8f5e1; --muted: #7da870;
      --ai-bubble: #1e3319; --user-bubble: #1B5016;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--green-dark); border-bottom: 2px solid var(--green-light); padding: 18px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
    .logo-box { width: 44px; height: 44px; background: var(--green-light); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #fff; }
    .header-text h1 { font-size: 1.25rem; font-weight: 700; }
    .header-text p { font-size: .8rem; color: var(--lime); opacity: .85; }
    #meta-section { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: none; }
    #meta-section.visible { display: block; }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .8px; color: var(--lime); }
    .meta-value { font-size: .95rem; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .8rem; font-weight: 700; }
    .badge-high { background: #2e7d32; color: #b9f6ca; }
    .badge-medium { background: #f57f17; color: #fff8e1; }
    .badge-low { background: #b71c1c; color: #ffcdd2; }
    #results-bar { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 16px 32px; display: none; flex-wrap: wrap; gap: 20px; }
    #results-bar.visible { display: flex; }
    .result-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: .85rem; }
    .result-chip .icon { font-size: 1.1rem; }
    .result-chip .label { color: var(--muted); }
    .result-chip .val { font-weight: 700; }
    #conversation { flex: 1; padding: 28px 32px; max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .turn { display: flex; gap: 12px; align-items: flex-start; }
    .turn.assistant { flex-direction: row; }
    .turn.user { flex-direction: row-reverse; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; flex-shrink: 0; }
    .avatar-ai { background: var(--green-dark); color: var(--lime); border: 2px solid var(--green-light); }
    .avatar-user { background: #2a4060; color: #90caf9; border: 2px solid #42a5f5; }
    .bubble { max-width: 72%; padding: 12px 16px; border-radius: 16px; font-size: .93rem; line-height: 1.6; }
    .bubble-ai { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }
    .bubble-user { background: var(--user-bubble); border-top-right-radius: 4px; }
    .speaker-name { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
    .ai-name { color: var(--lime); }
    .user-name { color: #90caf9; }
    #state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 60px 32px; text-align: center; }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--lime); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-icon { font-size: 3rem; }
    #state h2 { font-size: 1.3rem; }
    #state p { color: var(--muted); max-width: 380px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<header>
  <div class="logo-box">E</div>
  <div class="header-text">
    <h1>Ensola - Screening kandidata</h1>
    <p>Zaznam telefonickeho pohovoru</p>
  </div>
</header>
<div id="meta-section"><div class="meta-grid" id="meta-grid"></div></div>
<div id="results-bar"></div>
<div id="state"><div class="spinner"></div><h2>Nacitavam zaznam...</h2><p>Prosim, cakajte.</p></div>
<div id="conversation" style="display:none"></div>
<script>
const VAPI_KEY='042cd1b9-990b-489d-b990-5cf5563100b4';
const state=document.getElementById('state'),convo=document.getElementById('conversation'),metaSec=document.getElementById('meta-section'),metaGrid=document.getElementById('meta-grid'),resultsBar=document.getElementById('results-bar');
function showState(i,t,m){state.innerHTML='<div class="state-icon">'+i+'</div><h2>'+t+'</h2><p>'+m+'</p>';state.style.display='flex';convo.style.display='none';}
function fmt(ts){if(!ts)return'-';return new Date(ts).toLocaleString('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function dur(s){if(!s)return'-';return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0')+' min';}
function addMeta(l,v){const d=document.createElement('div');d.className='meta-item';d.innerHTML='<span class="meta-label">'+l+'</span><span class="meta-value">'+v+'</span>';metaGrid.appendChild(d);}
function badge(score){const n=parseInt(score,10);if(isNaN(n))return'<span class="badge">'+score+'</span>';const c=n>=8?'badge-high':n>=5?'badge-medium':'badge-low';return'<span class="badge '+c+'">'+n+'/10</span>';}
function chip(icon,label,val){const d=document.createElement('div');d.className='result-chip';d.innerHTML='<span class="icon">'+icon+'</span><span class="label">'+label+':</span><span class="val">'+val+'</span>';resultsBar.appendChild(d);}
function bool(v){if(v===true||v==='true'||v==='ano'||v==='yes')return'Yes';if(v===false||v==='false'||v==='nie'||v==='no')return'No';return v||'-';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/
/g,'<br>');}
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){showState('?','Ziadne ID hovoru','URL musi obsahovat ?id=');return;}
  try{
    const r=await fetch('https://api.vapi.ai/call/'+id,{headers:{Authorization:'Bearer '+VAPI_KEY}});
    if(!r.ok){showState('!','Chyba','Status: '+r.status);return;}
    const d=await r.json();
    addMeta('ID',id);addMeta('Zaciatok',fmt(d.startedAt));addMeta('Koniec',fmt(d.endedAt));addMeta('Trvanie',dur(d.durationSeconds));addMeta('Stav',d.status||'-');
    if(d.customer?.number)addMeta('Telefon',d.customer.number);
    metaSec.classList.add('visible');
    const an=d.analysis||{},st=an.structuredData||{};
    const h=st.hodnotenie||st.rating||an.rating,v=st.vysvetlenie||st.explanation||an.summary||'';
    if(h!==undefined){chip('*','Hodnotenie',badge(h));chip('+','Skusenosti',bool(st.skusenosti));chip('$','Proviznia dohoda',bool(st.suhlasProvize));chip('~','Cestovanie',bool(st.suhlasCestovanie));if(st.lokalita)chip('@','Lokalita',st.lokalita);if(st.nastup)chip('C','Nastup',st.nastup);resultsBar.classList.add('visible');}
    if(v){const e=document.createElement('div');e.className='result-chip';e.style.cssText='width:100%;flex-direction:column;align-items:flex-start;';e.innerHTML='<span class="label">Zhrnutie</span><span>'+v+'</span>';resultsBar.appendChild(e);}
    const msgs=d.messages||d.transcript||[];
    if(!msgs.length){showState('?','Ziadny prepis','');return;}
    state.style.display='none';convo.style.display='flex';
    msgs.forEach(m=>{
      const role=(m.role||'').toLowerCase();
      if(!['assistant','user','bot','human'].includes(role))return;
      const ai=role==='assistant'||role==='bot',txt=m.content||m.message||m.text||'';
      if(!txt.trim())return;
      const t=document.createElement('div');t.className='turn '+(ai?'assistant':'user');
      t.innerHTML='<div class="avatar '+(ai?'avatar-ai':'avatar-user')+'">'+(ai?'M':'K')+'</div><div class="bubble '+(ai?'bubble-ai':'bubble-user')+'"><div class="speaker-name '+(ai?'ai-name':'user-name')+'">'+(ai?'Marek (AI)':'Kandidat')+'</div>'+esc(txt)+'</div>';
      convo.appendChild(t);
    });
  }catch(e){showState('X','Chyba',e.message);}
})();
</script>
</body>
</html>
